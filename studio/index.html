<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web-page-helper studio</title>
    <link rel="stylesheet" href="/__studio/studio.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="topbar__brand">
          <span class="topbar__dot" aria-hidden="true"></span>
          <strong>studio</strong>
          <span class="topbar__muted" id="project-root">…</span>
        </div>

        <div class="topbar__controls">
          <label class="field field--inline">
            <span>Page</span>
            <select id="page-select" aria-label="Page to edit"></select>
          </label>
          <button type="button" class="btn" id="reload-page" title="Reload the preview from disk">Reload</button>
          <button type="button" class="btn btn--ghost" id="undo-btn" title="Undo the last save">Undo</button>
          <button type="button" class="btn btn--primary" id="save-btn" disabled>Save</button>
        </div>
      </header>

      <main class="layout">
        <aside class="pane pane--tree" aria-label="Page structure">
          <div class="pane__head">
            <h2>Structure</h2>
            <label class="pick">
              <input type="checkbox" id="pick-toggle" checked />
              <span>Pick in preview</span>
            </label>
          </div>
          <div class="tree" id="tree" role="tree" aria-label="DOM tree" tabindex="0"></div>
          <div class="pane__foot" id="tree-status"></div>
        </aside>

        <section class="pane pane--preview" aria-label="Preview">
          <div class="preview__bar">
            <span id="preview-url" class="preview__url">…</span>
            <span id="preview-hint" class="preview__hint"></span>
          </div>
          <div class="preview__frame">
            <iframe id="preview" title="Page preview" src="about:blank"></iframe>
          </div>
        </section>

        <aside class="pane pane--panel" aria-label="Settings">
          <div class="tabs" role="tablist" aria-label="Settings sections">
            <button role="tab" id="tab-node" aria-controls="panel-node" aria-selected="true">Element</button>
            <button role="tab" id="tab-layout" aria-controls="panel-layout" aria-selected="false">Layout</button>
            <button role="tab" id="tab-component" aria-controls="panel-component" aria-selected="false">Component</button>
            <button role="tab" id="tab-structure" aria-controls="panel-structure" aria-selected="false">Structure</button>
            <button role="tab" id="tab-frames" aria-controls="panel-frames" aria-selected="false">Frames</button>
            <button role="tab" id="tab-project" aria-controls="panel-project" aria-selected="false">Project</button>
          </div>

          <div class="panel" id="panel-node" role="tabpanel" aria-labelledby="tab-node">
            <p class="empty">Select an element in the preview or the tree.</p>
          </div>
          <div class="panel" id="panel-layout" role="tabpanel" aria-labelledby="tab-layout" hidden></div>
          <div class="panel" id="panel-component" role="tabpanel" aria-labelledby="tab-component" hidden></div>
          <div class="panel" id="panel-structure" role="tabpanel" aria-labelledby="tab-structure" hidden></div>
          <div class="panel" id="panel-frames" role="tabpanel" aria-labelledby="tab-frames" hidden></div>
          <div class="panel" id="panel-project" role="tabpanel" aria-labelledby="tab-project" hidden></div>

          <div class="pending" id="pending" hidden>
            <div class="pending__head">
              <strong id="pending-count">0 changes</strong>
              <button type="button" class="btn btn--ghost btn--sm" id="discard-btn">Discard</button>
            </div>
            <ul class="pending__list" id="pending-list"></ul>
          </div>
        </aside>
      </main>

      <footer class="statusbar">
        <span id="status">Ready</span>
        <span class="statusbar__right">
          <span id="node-path" class="mono"></span>
        </span>
      </footer>
    </div>

    <dialog id="diff-dialog" class="diff">
      <form method="dialog" class="diff__form">
        <header class="diff__head">
          <h2 id="diff-title">Review changes</h2>
          <button class="btn btn--ghost btn--sm" value="cancel">Close</button>
        </header>
        <div class="diff__body" id="diff-body"></div>
        <footer class="diff__foot">
          <span id="diff-note" class="muted"></span>
          <button class="btn btn--primary" id="confirm-save" value="save">Write to disk</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="/__studio/panel.js"></script>
  </body>
</html>
