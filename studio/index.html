<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web-page-helper studio</title>
    <link rel="stylesheet" href="/__studio/studio.css" />
    <!-- panel.js imports these two; naming them here turns three serial waves
         (panel -> ops/suggest) into one request wave on a high-latency link. -->
    <link rel="modulepreload" href="/__studio/ops.js" />
    <link rel="modulepreload" href="/__studio/suggest.js" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="topbar__brand">
          <span class="topbar__dot" aria-hidden="true"></span>
          <strong>studio</strong>
          <span class="topbar__muted" id="project-root">…</span>
        </div>

        <div class="topbar__controls">
          <label class="field field--inline">
            <span>Page</span>
            <select id="page-select" aria-label="Page to edit"></select>
          </label>
          <button type="button" class="btn" id="open-project" title="Load another project folder from disk">Open…</button>
          <button type="button" class="btn" id="reload-page" title="Reload the preview from disk">Reload</button>
          <button type="button" class="btn btn--ghost" id="undo-btn" title="Undo the last save">Undo</button>
          <button type="button" class="btn btn--primary" id="save-btn" disabled>Save</button>
        </div>
      </header>

      <main class="layout">
        <aside class="pane pane--tree" aria-label="Page structure">
          <div class="pane__head">
            <h2>Structure</h2>
            <label class="pick">
              <input type="checkbox" id="pick-toggle" checked />
              <span>Pick in preview</span>
            </label>
          </div>
          <div class="tree" id="tree" role="tree" aria-label="DOM tree" tabindex="0"></div>
          <div class="pane__foot" id="tree-status"></div>
        </aside>

        <section class="pane pane--preview" aria-label="Preview">
          <div class="preview__bar">
            <span id="preview-url" class="preview__url">…</span>
            <span id="preview-hint" class="preview__hint"></span>
          </div>
          <div class="preview__frame">
            <iframe id="preview" title="Page preview" src="about:blank"></iframe>
          </div>
        </section>

        <aside class="pane pane--panel" aria-label="Settings">
          <div class="tabs" role="tablist" aria-label="Settings sections">
            <button role="tab" id="tab-appearance" aria-controls="panel-appearance" aria-selected="true">스타일<span class="help" role="img" aria-label="색·글자 크기·모서리 둥글기를 바꿉니다. 초보자가 가장 먼저 쓰는 설정입니다." title="색·글자 크기·모서리 둥글기를 바꿉니다. 초보자가 가장 먼저 쓰는 설정입니다." tabindex="0">?</span></button>
            <button role="tab" id="tab-layout" aria-controls="panel-layout" aria-selected="false">배치<span class="help" role="img" aria-label="요소를 가로·세로로 놓고, 간격과 여백을 정합니다. 위치 조정은 여기서 합니다." title="요소를 가로·세로로 놓고, 간격과 여백을 정합니다. 위치 조정은 여기서 합니다." tabindex="0">?</span></button>
            <button role="tab" id="tab-node" aria-controls="panel-node" aria-selected="false">내용<span class="help" role="img" aria-label="글자 내용과 HTML 속성(id·class·role 등)을 직접 편집합니다." title="글자 내용과 HTML 속성(id·class·role 등)을 직접 편집합니다." tabindex="0">?</span></button>
            <button role="tab" id="tab-structure" aria-controls="panel-structure" aria-selected="false">구조<span class="help" role="img" aria-label="요소를 넣고·옮기고·복제·삭제하고, 페이지 전체 골격(헤더/사이드바/푸터)을 만듭니다." title="요소를 넣고·옮기고·복제·삭제하고, 페이지 전체 골격(헤더/사이드바/푸터)을 만듭니다." tabindex="0">?</span></button>
            <button role="tab" id="tab-component" aria-controls="panel-component" aria-selected="false">컴포넌트<span class="help" role="img" aria-label="헤드리스 파운데이션의 옵션이나 유저 컴포넌트의 props를 폼으로 설정합니다." title="헤드리스 파운데이션의 옵션이나 유저 컴포넌트의 props를 폼으로 설정합니다." tabindex="0">?</span></button>
            <button role="tab" id="tab-project" aria-controls="panel-project" aria-selected="false">프로젝트<span class="help" role="img" aria-label="프로젝트 구성·페이지 목록·디자인 토큰·편집이 막힌 이유를 보여줍니다." title="프로젝트 구성·페이지 목록·디자인 토큰·편집이 막힌 이유를 보여줍니다." tabindex="0">?</span></button>
          </div>

          <div class="panel" id="panel-appearance" role="tabpanel" aria-labelledby="tab-appearance">
            <p class="empty">Select an element in the preview or the tree.</p>
          </div>
          <div class="panel" id="panel-layout" role="tabpanel" aria-labelledby="tab-layout" hidden></div>
          <div class="panel" id="panel-node" role="tabpanel" aria-labelledby="tab-node" hidden>
            <p class="empty">Select an element in the preview or the tree.</p>
          </div>
          <div class="panel" id="panel-structure" role="tabpanel" aria-labelledby="tab-structure" hidden></div>
          <div class="panel" id="panel-component" role="tabpanel" aria-labelledby="tab-component" hidden></div>
          <div class="panel" id="panel-project" role="tabpanel" aria-labelledby="tab-project" hidden></div>

          <div class="pending" id="pending" hidden>
            <div class="pending__head">
              <strong id="pending-count">0 changes</strong>
              <button type="button" class="btn btn--ghost btn--sm" id="discard-btn">Discard</button>
            </div>
            <ul class="pending__list" id="pending-list"></ul>
          </div>
        </aside>
      </main>

      <footer class="statusbar">
        <span id="status">Ready</span>
        <span class="statusbar__right">
          <span id="node-path" class="mono"></span>
        </span>
      </footer>
    </div>

    <dialog id="diff-dialog" class="diff">
      <form method="dialog" class="diff__form">
        <header class="diff__head">
          <h2 id="diff-title">Review changes</h2>
          <button class="btn btn--ghost btn--sm" value="cancel">Close</button>
        </header>
        <div class="diff__body" id="diff-body"></div>
        <footer class="diff__foot">
          <span id="diff-note" class="muted"></span>
          <button class="btn btn--primary" id="confirm-save" value="save">Write to disk</button>
        </footer>
      </form>
    </dialog>

    <dialog id="picker-dialog" class="diff picker">
      <form method="dialog" class="diff__form">
        <header class="diff__head">
          <h2>Open a project folder</h2>
          <button class="btn btn--ghost btn--sm" value="cancel">Close</button>
        </header>
        <div class="picker__bar">
          <button type="button" class="btn btn--ghost btn--sm" id="picker-up">Up</button>
          <span class="picker__path mono" id="picker-path">…</span>
        </div>
        <div class="diff__body picker__body" id="picker-body"></div>
        <footer class="diff__foot">
          <span id="picker-note" class="muted"></span>
          <button type="button" class="btn btn--primary" id="picker-open" disabled>Open this folder</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="/__studio/panel.js"></script>
  </body>
</html>
